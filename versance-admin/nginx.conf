server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  location = /admin/system { try_files /admin/system.html =404; }
  location = /admin/pages { return 301 /admin/public; }
  location = /admin/public { try_files /admin/public/index.html =404; }
  location = / { try_files /index.html =404; }

  # /public/<mount>/ serves a repo folder in place (^~ so the css/js/woff2 rules below do not capture it); single files are served at their /public/<slug> URL by an internal rewrite (the root copies are internal); /admin/source/<file> is the page source as text (all generated)
  # BEGIN generated by tools/build_admin.py
  location = /public/extension { return 301 /public/extension/; }
  location ^~ /public/extension/ { alias /usr/share/nginx/html/browser-extension/; index index.html; }
  location = /public/web-app { rewrite ^ /versance.html break; }
  location = /public/edgar-web-app { rewrite ^ /edgar/versance.html break; }
  location = /public/medicus { rewrite ^ /medicus-01.html break; }
  location = /versance.html { internal; }
  location = /edgar/versance.html { internal; }
  location = /medicus-01.html { internal; }
  location = /public { try_files /index.html =404; }
  location = /public/ { try_files /index.html =404; }
  location ~ ^/admin/source/(browser-extension/style-v[0-9]+/(?:screens|design-system)/[A-Za-z0-9._-]+|versance\.html|edgar/versance\.html|medicus-01\.html)$ { alias /usr/share/nginx/html/$1; types { } default_type "text/plain; charset=utf-8"; }
  # END generated

  # fonts and tokens are linked from other sites (the skill's starter page), so allow cross-origin loads
  location ~* \.woff2$ { add_header Access-Control-Allow-Origin "*"; try_files $uri =404; }
  # stylesheets revalidate on every load, so a CSS change shows up without a hard refresh
  location ~* \.(css|js)$ { add_header Access-Control-Allow-Origin "*"; add_header Cache-Control "no-cache"; try_files $uri =404; }

  location / { try_files $uri $uri/ =404; }
}
