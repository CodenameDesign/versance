<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Versance starter</title>
<!-- Link the tokens and fonts (adjust the host), then build only with the token variables. -->
<link rel="stylesheet" href="__SITE__/design-tokens/fonts.css">
<link rel="stylesheet" href="__SITE__/design-tokens/tokens.css">
<style>
  body{margin:0;background:var(--color-page-bg);color:var(--color-text);font:var(--font-weight-regular) var(--font-size-md)/var(--line-height-md) var(--font-family);-webkit-font-smoothing:antialiased}
  header{background:var(--color-ink);color:var(--color-text-on-dark);display:flex;align-items:center;gap:var(--space-6);padding:var(--space-4) var(--space-6)}
  header nav{display:flex;gap:var(--space-1)}
  header nav a{color:var(--color-text-on-dark);text-decoration:none;padding:7.5px var(--space-3);border-radius:var(--radius-pill);font-size:var(--font-size-nav);line-height:var(--line-height-nav);font-weight:var(--font-weight-semibold);transition:background-color var(--duration-fast) var(--ease-standard)}
  header nav a:hover,header nav a[aria-current=page]{background:var(--color-ink-soft)}
  main{max-width:var(--content-max-width);margin:0 auto;padding:var(--space-8) var(--space-6)}
  h1{margin:0 0 var(--space-6);font-size:var(--font-size-title);line-height:var(--line-height-title);font-weight:var(--font-weight-title)}
  a{color:var(--color-primary)}
  a:hover{color:var(--color-primary-hover)}
  .card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-panel);padding:var(--card-padding)}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:var(--pad-btn);border:1px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-surface);color:var(--color-text);font:inherit;cursor:pointer;transition:border-color var(--duration-fast),color var(--duration-fast)}
  .btn:hover{border-color:var(--color-primary);color:var(--color-primary)}
  .btn.p{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-text-on-dark)}
  .btn.p:hover{background:var(--color-primary-hover);border-color:var(--color-primary-hover)}
  .pill{display:inline-flex;padding:var(--pad-pill);border-radius:var(--radius-pill);background:var(--color-surface-alt);color:var(--color-text-muted)}
  .pill.sel{background:var(--color-primary-tint-15);color:var(--color-primary);font-weight:var(--font-weight-semibold)}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:var(--font-size-thead);line-height:var(--line-height-thead);font-weight:var(--font-weight-thead);text-transform:uppercase;letter-spacing:.04em;color:var(--color-text-muted);padding:var(--space-2);border-bottom:1px solid var(--color-border)}
  td{padding:var(--space-2);border-bottom:1px solid var(--color-border-light)}
</style>
</head>
<body>
<header><strong>Versance</strong><nav><a href="#" aria-current="page">Ask</a><a href="#">Filings</a><a href="#">History</a></nav></header>
<main>
  <h1>Page title</h1>
  <p><button class="btn p" type="button">Export Report</button> <button class="btn" type="button">Cancel</button> <span class="pill sel">Filings</span> <span class="pill">Web Search</span></p>
  <div class="card"><table><thead><tr><th>Filing</th><th>Company</th><th>Date</th></tr></thead>
  <tbody><tr><td><a href="#">10-K 2025</a></td><td>Example Corp</td><td>Mar 3, 2026</td></tr></tbody></table></div>
</main>
</body>
</html>
