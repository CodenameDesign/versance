<style>
  /* ── Tokens ── */
  /* Figma palette: Night #000, Midnight Teal #0A1922, Vibrant Indigo #334EFE,
     Vibrant Indigo 2 #2B40C5, Soft Cloud #F3F5F9, Soft Cloud 2 #D9DDE5,
     Cool Slate #8D96AA, Cool Slate 2 #65728E, Green #5AC47E, Green 2 #DEF3E5,
     Yellow #E2B43D */
  :root {
    --bg:           #FFFFFF;
    --sidebar-bg:   #FFFFFF;
    --sidebar-bd:   #D9DDE5;
    --sidebar-hover: #F3F5F9;
    --panel:        #FFFFFF;
    --ink:          #000000;
    --muted:        #65728E;
    --faint:        #8D96AA;
    --line:         #D9DDE5;
    --line2:        #F3F5F9;
    --accent:       #5AC47E;
    --accent-d:     #3DA865;
    --accent-bg:    #DEF3E5;
    --accent-text:  #1C6B38;
    --amber:        #E2B43D;
    --green:        #5AC47E;
    --chip:         #F3F5F9;
    --new-btn:      #000000;
    --new-btn-h:    #0A1922;
    --shadow-sm:    0 1px 2px rgba(0,0,0,.05), 0 3px 10px rgba(0,0,0,.06);
    --shadow:       0 1px 3px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.08);

    /* source type colors */
    --col-filing:    #2B40C5;
    --col-news:      #E2B43D;
    --col-transcript:#334EFE;
    --col-web:       #65728E;
    --col-ask:       #5AC47E;
    --col-compare:   #5AC47E;
    --col-create:    #E2B43D;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:           #0A1922;
      --sidebar-bg:   #0D2030;
      --sidebar-bd:   #1A3040;
      --sidebar-hover: #152838;
      --panel:        #0D2030;
      --ink:          #F3F5F9;
      --muted:        #8D96AA;
      --faint:        #65728E;
      --line:         #1A3040;
      --line2:        #152838;
      --accent:       #5AC47E;
      --accent-d:     #7DD498;
      --accent-bg:    #0D2A18;
      --accent-text:  #7DD498;
      --chip:         #152838;
      --new-btn:      #F3F5F9;
      --new-btn-h:    #FFFFFF;
      --shadow-sm:    0 1px 2px rgba(0,0,0,.3), 0 3px 10px rgba(0,0,0,.4);
      --shadow:       0 1px 3px rgba(0,0,0,.35), 0 6px 20px rgba(0,0,0,.5);
    }
  }

  :root[data-theme="dark"] {
    --bg:           #0A1922;
    --sidebar-bg:   #0D2030;
    --sidebar-bd:   #1A3040;
    --sidebar-hover: #152838;
    --panel:        #0D2030;
    --ink:          #F3F5F9;
    --muted:        #8D96AA;
    --faint:        #65728E;
    --line:         #1A3040;
    --line2:        #152838;
    --accent:       #5AC47E;
    --accent-d:     #7DD498;
    --accent-bg:    #0D2A18;
    --accent-text:  #7DD498;
    --chip:         #152838;
    --new-btn:      #F3F5F9;
    --new-btn-h:    #FFFFFF;
    --shadow-sm:    0 1px 2px rgba(0,0,0,.3), 0 3px 10px rgba(0,0,0,.4);
    --shadow:       0 1px 3px rgba(0,0,0,.35), 0 6px 20px rgba(0,0,0,.5);
  }

  :root[data-theme="light"] {
    --bg:           #FFFFFF;
    --sidebar-bg:   #FFFFFF;
    --sidebar-bd:   #D9DDE5;
    --sidebar-hover: #F3F5F9;
    --panel:        #FFFFFF;
    --ink:          #000000;
    --muted:        #65728E;
    --faint:        #8D96AA;
    --line:         #D9DDE5;
    --line2:        #F3F5F9;
    --accent:       #5AC47E;
    --accent-d:     #3DA865;
    --accent-bg:    #DEF3E5;
    --accent-text:  #1C6B38;
    --chip:         #F3F5F9;
    --new-btn:      #000000;
    --new-btn-h:    #0A1922;
    --shadow-sm:    0 1px 2px rgba(0,0,0,.05), 0 3px 10px rgba(0,0,0,.06);
    --shadow:       0 1px 3px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.08);
  }

  /* ── Reset ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 13.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; outline: none; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  input, textarea { font-family: inherit; }
  input:focus, textarea:focus { outline: none; }

  /* ── App shell ── */
  .app { display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  .sidebar {
    width: 230px; flex: 0 0 230px;
    background: var(--sidebar-bg);
    display: flex; flex-direction: column;
    padding: 20px;
    overflow-y: auto;
  }

  .logo {
    display: block;
    padding: 0px 0px 30px; cursor: pointer;
  }
  .logo-svg { display: block; height: 38px; width: auto; }
  @media (prefers-color-scheme: dark) { .logo-svg { filter: invert(1); } }
  :root[data-theme="dark"] .logo-svg { filter: invert(1); }
  :root[data-theme="light"] .logo-svg { filter: none; }

  /* New button */
  .new-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 7.5px 12px 7.5px 8px;
    border-radius: 999px;
    background: var(--sidebar-hover);
    color: var(--ink);
    font-size: 13px; font-weight: 500;
    width: 100%; text-align: left;
    margin-bottom: 6px;
    transition: background .15s;
  }
  .new-btn:hover { background: var(--sidebar-bd); }
  .new-btn .new-icon {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--new-btn);
    color: var(--bg);
    display: flex; align-items: center; justify-content: center;
    flex: 0 0 20px;
  }
  .new-btn .new-icon svg { width: 10px; height: 10px; }

  /* Nav items */
  .navbtn {
    display: flex; align-items: center; gap: 9px;
    padding: 7.5px 10px;
    border-radius: 999px;
    color: var(--muted);
    font-size: 14px;
    width: 100%; text-align: left;
    margin-bottom: 6px;
    transition: background .12s, color .12s;
  }
  .navbtn:hover { background: var(--sidebar-hover); color: var(--ink); }
  .navbtn.active { background: #C7E2F0; color: #000000; font-weight: 600; border-radius: 999px; }
  .navbtn .ic { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; flex: 0 0 20px; }
  .navbtn .ic svg { width: 17px; height: 17px; }

  .nav-divider { border: none; border-top: 1px dashed var(--line); margin: 7px 6px; }
  .spacer { flex: 1; }

  /* Context chip */
  .ctxchip {
    display: flex; align-items: center; gap: 9px;
    padding: 7.5px 10px; border-radius: 999px;
    font-size: 14px; font-weight: 600;
    background: var(--accent-bg); color: var(--accent-text);
    margin: 0 0 6px;
  }
  .ctxchip.empty {
    background: transparent; color: var(--faint);
    font-weight: 400; border: 1px dashed var(--line);
  }
  .ctxchip .x { margin-left: auto; cursor: pointer; opacity: .55; font-size: 12px; }
  .ctxchip .x:hover { opacity: 1; }
  .ctxbtn {
    display: flex; align-items: center; gap: 9px;
    padding: 7.5px 10px; border-radius: 999px;
    font-size: 14px; color: var(--muted); width: 100%;
    transition: background .12s;
  }
  .ctxbtn:hover { background: var(--sidebar-hover); color: var(--ink); }
  .ctxbtn .ic { flex: 0 0 20px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
  .ctxbtn .ic svg { width: 17px; height: 17px; }

  /* ── Main ── */
  .main {
    flex: 1; min-width: 0;
    overflow-y: auto;
    background: var(--bg);
    position: relative;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 32px 32px; }
  .sticky-composer { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0 24px; }
  .wrap.wide { max-width: 1020px; }

  /* ── Composer ── */
  .composer {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 16px 16px 13px;
    position: relative;
  }
  .composer textarea {
    width: 100%; border: none; resize: none;
    font-family: "Roboto Mono", monospace;
    font-size: 15px; line-height: 1.55;
    outline: none; background: transparent;
    min-height: 26px; color: var(--ink);
  }
  .composer textarea::placeholder { color: var(--faint); }
  .cbar {
    display: flex; align-items: center; gap: 6px;
    flex-wrap: nowrap; margin-top: 12px;
    padding-right: 46px;
  }
  /* pill controls */
  .cpill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12.5px; color: var(--muted);
    background: var(--sidebar-hover);
    border: none;
    white-space: nowrap;
    transition: color .12s, background .12s;
    cursor: pointer;
  }
  .cpill:hover { background: var(--line); color: var(--ink); }
  .cpill.on { background: var(--accent-bg); color: var(--accent-text); font-weight: 600; }

  /* iOS toggle inside pill */
  .tog {
    display: inline-block; position: relative;
    width: 26px; height: 15px; border-radius: 999px;
    background: var(--line); flex: 0 0 26px;
    transition: background .2s;
  }
  .tog::after {
    content: ''; position: absolute;
    top: 2px; left: 2px;
    width: 11px; height: 11px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
    transition: left .18s;
  }
  .tog.on { background: #5AC47E; }
  .tog.on::after { left: 13px; }

  .send-btn {
    position: absolute; bottom: 13px; right: 14px;
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--accent-bg); color: var(--accent-text);
    display: flex; align-items: center; justify-content: center;
    flex: none;
    transition: background .15s, color .15s;
  }
  .send-btn:hover { background: var(--accent); color: #fff; }
  .send-btn svg { width: 15px; height: 15px; }

  .srcnote { font-size: 12px; color: var(--faint); margin-top: 8px; padding-left: 2px; }
  .srcnote b { color: var(--accent-text); font-weight: 600; }
  .content-divider { border: none; border-top: 1px dashed var(--line); margin: 24px 0 24px; }

  /* ── Home ── */
  .page-eyebrow { font-size: 11.5px; color: var(--faint); font-weight: 500; letter-spacing: .3px; margin-bottom: 7px; }
  .hero { margin: 6vh 0 28px; }
  .hero h1 {
    font-size: 28px; font-weight: 700;
    letter-spacing: -.5px; margin-bottom: 8px;
    text-wrap: balance; color: var(--ink);
  }
  .hero p { color: var(--muted); font-size: 14px; line-height: 1.65; white-space: nowrap; }

  .homestrip { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 28px; }
  .card {
    background: var(--sidebar-hover);
    border-radius: 16px; padding: 18px 20px;
  }
  .card h4 {
    margin-bottom: 12px;
    font-size: 13px; color: var(--muted); font-weight: 600;
  }
  .rowlink {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 4px; border-radius: 8px;
    font-size: 14px; cursor: pointer;
    transition: background .1s;
    color: var(--ink);
  }
  .rowlink:hover { background: var(--line2); }
  .rowlink span.label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* tags */
  .tg {
    font-size: 10px; padding: 3px 8px; border-radius: 6px;
    font-weight: 700; color: #fff; letter-spacing: .4px;
    flex: 0 0 auto; display: inline-block; white-space: nowrap;
  }
  .tg.filing    { background: #2B40C5; }
  .tg.news      { background: var(--col-news); }
  .tg.transcript{ background: #EA5B5B; }
  .tg.web       { background: var(--col-web); }
  .tg.ask       { background: #65728E; }
  .tg.ask-amber { background: #E2B43D; }
  .tg.create    { background: #E2B43D; }
  .tg.cmp       { background: #5AC47E; }

  /* ── Disambiguation ── */
  .disamb {
    background: #FFFBF0; border: 1px solid #ECD98A;
    border-radius: 12px; padding: 14px 16px; margin-top: 14px;
  }
  .disamb .q { font-size: 13.5px; margin-bottom: 10px; }
  .disamb .q b { color: var(--amber); }
  .disamb .opts { display: flex; gap: 8px; flex-wrap: wrap; }
  .disamb .opt {
    padding: 7px 13px; border: 1px solid var(--line);
    border-radius: 9px; background: var(--panel); font-size: 13px;
    cursor: pointer; transition: border-color .12s, color .12s;
  }
  .disamb .opt:hover { border-color: var(--accent); color: var(--accent-text); }

  /* ── Answer ── */
  .answer-topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .answer-topbar-inner {
    max-width: 760px; margin: 0 auto;
    padding: 14px 32px;
    display: flex; align-items: center; gap: 10px;
    font-size: 14px; color: var(--muted);
  }
  .answer-topbar-inner.wide { max-width: 1020px; }
  .answer-topbar-inner.flush { max-width: none; margin: 0; }
  .answer-ctx-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent-bg); color: var(--accent-text);
    padding: 4px 10px; border-radius: 999px;
    font-size: 13px; font-weight: 500;
  }
  .answer-ctx-pill .xbtn { cursor: pointer; opacity: .55; font-size: 13px; }
  .answer-ctx-pill .xbtn:hover { opacity: 1; }
  .back-link { font-size: 13px; color: var(--muted); cursor: pointer; }
  .back-link:hover { color: var(--ink); }
  .qhead { font-size: 21px; font-weight: 700; letter-spacing: -.3px; margin: 0 0 6px; text-wrap: balance; }
  .detect { font-size: 12px; color: var(--faint); margin-bottom: 18px; }
  .detect b { color: var(--accent-text); }
  .srchead {
    display: flex; align-items: center; gap: 7px;
    font-size: 10.5px; letter-spacing: .5px; text-transform: uppercase;
    color: var(--faint); font-weight: 700; margin: 2px 0 10px;
    cursor: pointer; user-select: none;
  }
  .srchead:hover { color: var(--muted); }
  .src-chevron { display: flex; align-items: center; transition: transform .2s; }
  .src-chevron.open { transform: rotate(90deg); }
  .src-body { overflow: hidden; transition: opacity .2s; }
  .src-body.collapsed { display: none; }
  .sources { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 22px; }
  .src {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px; font-size: 11.5px; cursor: pointer;
    transition: border-color .12s, transform .12s;
  }
  .src:hover { border-color: var(--faint); transform: translateY(-1px); }
  .src .st { color: var(--ink); line-height: 1.35; font-weight: 500; margin-top: 6px; }
  .src .sm { color: var(--faint); margin-top: 4px; }
  .answer { font-size: 14.5px; line-height: 1.72; }
  .answer h3 { font-size: 14px; margin: 20px 0 7px; font-weight: 700; color: var(--ink); }
  .answer p  { margin: 0 0 12px; color: var(--ink); }
  .cite {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 16px; height: 16px; padding: 0 4px;
    background: var(--accent-bg); color: var(--accent-text);
    border-radius: 4px; font-size: 10px; font-weight: 700;
    vertical-align: top; margin: 0 1px; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .progress { display: flex; flex-direction: column; gap: 6px; margin: 6px 0 20px; }
  .pstep { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .pstep .pk {
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 8px;
    display: flex; align-items: center; justify-content: center; flex: 0 0 15px;
  }
  .followups { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 14px; }
  .followups h4 { margin: 0 0 6px; font-size: 10.5px; letter-spacing: .5px; text-transform: uppercase; color: var(--faint); font-weight: 600; }
  .fu {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 4px; border-bottom: 1px solid var(--line2);
    font-size: 13.5px; cursor: pointer; transition: color .12s;
  }
  .fu:hover { color: var(--accent-text); }
  .fu .pl { color: var(--accent); font-size: 18px; }
  .aacts { display: flex; gap: 8px; margin: 18px 0 24px; }

  /* ── Company / Browse ── */
  .cover { margin-bottom: 8px; }
  .cover h1 { font-size: 22px; font-weight: 700; margin: 0 0 3px; }
  .cover .tick { color: var(--muted); font-size: 12px; }
  .cdesc { color: var(--muted); margin: 12px 0 16px; line-height: 1.65; font-size: 14px; }
  .metrics { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 18px; }
  .metric { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; }
  .metric .mv { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .metric .ml { font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .3px; margin-top: 3px; }
  .co-page-layout {
    display: flex;
    height: calc(100vh - 49px);
    overflow: hidden;
  }
  .co-left {
    flex: 1; overflow-y: auto;
    padding: 40px 40px 40px 32px;
  }
  .co-right {
    flex: 0 0 50%;
    display: flex; flex-direction: column;
    border-left: 1px solid var(--line);
    box-sizing: border-box;
    overflow: hidden;
  }
  .co-right .chatlog { flex: 1; overflow-y: auto; padding: 24px 32px 8px; display: flex; flex-direction: column; justify-content: flex-end; }
  .co-right .sticky-composer { flex: 0 0 auto; padding: 0 32px 24px; background: var(--bg); }
  .co-prompts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .co-prompt {
    padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px;
    font-size: 13px; color: var(--muted); background: var(--panel);
    text-align: left; cursor: pointer; transition: border-color .12s, color .12s;
    align-self: flex-start;
  }
  .co-prompt:hover { border-color: var(--accent); color: var(--ink); }
  .co-lhd { font-size: 10.5px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--faint); margin-bottom: 10px; }

  .pagehd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .pagehd h1 { font-size: 20px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 10px; }
  .scopetoggle {
    display: inline-flex; background: var(--chip); border-radius: 9px; padding: 2px;
  }
  .scopetoggle button {
    padding: 5px 12px; border-radius: 7px; font-size: 12px; font-weight: 600; color: var(--muted);
    transition: background .12s, color .12s;
  }
  .scopetoggle button.on {
    background: var(--panel); color: var(--accent-text);
    box-shadow: 0 1px 3px rgba(0,0,0,.07);
  }
  .browsesearch {
    width: 100%; padding: 10px 14px; border: 1px solid var(--line);
    border-radius: 10px; font-size: 13.5px; margin-bottom: 14px;
    background: var(--panel); color: var(--ink);
    transition: border-color .15s;
  }
  .browsesearch:focus { border-color: var(--accent); }
  .doc {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 12px; border: 1px solid var(--line);
    border-radius: 10px; cursor: pointer; margin-bottom: 7px;
    background: var(--panel); transition: border-color .12s;
  }
  .doc:hover { border-color: var(--accent); }
  .doc .dt { flex: 1; font-size: 13px; color: var(--ink); }
  .doc .co { color: var(--faint); font-size: 11px; margin-top: 2px; }
  .doc .dd { color: var(--faint); font-size: 12px; flex: 0 0 90px; text-align: right; font-variant-numeric: tabular-nums; }
  .directory .comp {
    display: flex; align-items: center; gap: 12px;
    padding: 12px; border: 1px solid var(--line);
    border-radius: 10px; cursor: pointer; margin-bottom: 7px;
    background: var(--panel); transition: border-color .12s;
  }
  .directory .comp:hover { border-color: var(--accent); }
  .directory .cb {
    width: 36px; height: 36px; border-radius: 9px;
    background: linear-gradient(135deg, #5AC47E, #CEEBE5); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; flex: 0 0 36px;
  }

  /* ── Document split ── */
  .split { display: grid; grid-template-columns: 1fr 1fr; height: 100vh; }
  .viewer { border-right: 1px solid var(--line); background: var(--sidebar-bg); overflow-y: auto; padding: 24px; }
  .co-left h2 { font-size: 22px; font-weight: 700; margin: 0 0 4px; color: var(--ink); letter-spacing: -.2px; }
  .co-left .sub { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
  .co-left p { font-size: 14px; line-height: 1.7; color: var(--muted); margin: 0 0 12px; }
  .co-left b { color: var(--ink); font-weight: 600; }
  .chatside { display: flex; flex-direction: column; height: 100vh; }
  .crumb {
    display: flex; align-items: center; gap: 7px;
    padding: 12px 18px; border-bottom: 1px solid var(--line);
    font-size: 12px; color: var(--faint); flex: 0 0 auto;
  }
  .crumb a { color: var(--muted); cursor: pointer; transition: color .1s; }
  .crumb a:hover { color: var(--accent-text); }
  .crumb .cur { color: var(--ink); font-weight: 600; }
  .chatlog { flex: 1; overflow-y: auto; padding: 18px; }
  .msg { margin-bottom: 14px; }
  .msg.u { text-align: right; }
  .bubble {
    display: inline-block; max-width: 88%;
    padding: 9px 13px; border-radius: 12px;
    font-size: 13.5px; line-height: 1.6; text-align: left;
  }
  .msg.u .bubble { background: var(--accent-bg); color: var(--accent-text); }
  .msg.a .bubble { background: var(--sidebar-bg); color: var(--ink); }
  .chatcompose {
    border-top: 1px solid var(--line);
    padding: 12px 16px 16px; flex: 0 0 auto; background: var(--bg);
  }
  .preprompts { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; margin-bottom: 9px; }
  .pp {
    padding: 7px 13px; border: 1px solid var(--line);
    border-radius: 20px; font-size: 12.5px;
    background: var(--panel); color: var(--muted);
    transition: border-color .12s, color .12s;
  }
  .pp:hover { border-color: var(--accent); color: var(--accent-text); }
  .pp.wide { min-width: 180px; text-align: center; }
  .pp.act { background: var(--accent-bg); border-color: transparent; color: var(--accent-text); font-weight: 600; }
  .cinput { display: flex; gap: 8px; align-items: center; }
  .cinput input {
    flex: 1; padding: 10px 13px; border: 1px solid var(--line);
    border-radius: 10px; font-size: 13.5px;
    background: var(--panel); color: var(--ink);
    transition: border-color .15s;
  }
  .cinput input:focus { border-color: var(--accent); }

  /* ── Compare ── */
  .cmpbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .cmpchip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 12px; border-radius: 8px;
    background: var(--accent-bg); color: var(--accent-text);
    font-size: 13px; font-weight: 600;
  }
  .cmpchip .x { cursor: pointer; opacity: .6; transition: opacity .1s; }
  .cmpchip .x:hover { opacity: 1; }
  .addcmp {
    padding: 6px 12px; border: 1px dashed var(--line);
    border-radius: 8px; font-size: 13px; color: var(--muted);
    transition: border-color .12s, color .12s;
  }
  .addcmp:hover { border-color: var(--accent); color: var(--accent-text); }
  .cmp-wrap { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  table.cmp {
    width: 100%; border-collapse: collapse; font-size: 13.5px;
  }
  table.cmp th, table.cmp td {
    padding: 14px 18px; text-align: left;
    border-bottom: 1px solid var(--line); vertical-align: top;
  }
  table.cmp tbody tr:last-child td { border-bottom: none; }
  table.cmp th { font-size: 13.5px; font-weight: 700; color: var(--ink); background: #F3F5F9; }
  table.cmp td { background: var(--panel); color: var(--ink); }
  table.cmp td:first-child { color: var(--muted); font-weight: 400; width: 160px; background: #F9FAFC; }
  .dimchips { display: flex; gap: 7px; flex-wrap: wrap; margin: 12px 0; }
  .dimchip {
    padding: 5px 11px; border: 1px solid var(--line);
    border-radius: 20px; font-size: 12px;
    background: var(--panel); cursor: pointer;
    color: var(--muted); transition: background .12s, border-color .12s, color .12s;
  }
  .dimchip.on { background: var(--accent-bg); border-color: transparent; color: var(--accent-text); font-weight: 600; }

  /* ── Report ── */
  .reportwrap { display: grid; grid-template-columns: 252px 1fr; height: 100vh; }
  .outline {
    background: var(--sidebar-bg); border-right: 1px solid var(--line);
    padding: 18px 14px; overflow-y: auto;
  }
  .outline h4 { margin: 0 0 4px; font-size: 10.5px; letter-spacing: .5px; text-transform: uppercase; color: var(--faint); font-weight: 700; }
  .outline .hint { font-size: 11.5px; color: var(--faint); margin-bottom: 14px; line-height: 1.5; }
  .secrow {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 10px; border-radius: 8px; font-size: 13px;
    margin-bottom: 4px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line);
    transition: border-color .12s;
  }
  .secrow.off { opacity: .5; background: transparent; }
  .secrow .cx {
    width: 15px; height: 15px; border-radius: 4px;
    border: 1.5px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: #fff; background: var(--accent);
    flex: 0 0 15px;
  }
  .secrow.off .cx { background: transparent; color: transparent; border-color: var(--faint); }
  .secrow .drag { margin-left: auto; color: var(--faint); font-size: 14px; }
  .addsec {
    width: 100%; padding: 9px; border: 1px dashed var(--line);
    border-radius: 8px; font-size: 12px; color: var(--muted); margin-top: 6px;
    transition: border-color .12s, color .12s;
  }
  .addsec:hover { border-color: var(--accent); color: var(--accent-text); }
  .reportview { overflow-y: auto; }
  .rvtop {
    display: flex; align-items: center; gap: 10px;
    padding: 13px 22px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--bg); z-index: 5;
    font-size: 13.5px; font-weight: 700; color: var(--ink);
  }
  .rvtop .v {
    font-size: 10px; background: var(--chip);
    padding: 2px 8px; border-radius: 20px; color: var(--muted);
    font-weight: 700; letter-spacing: .3px;
  }
  .rvbody { padding: 26px 34px; max-width: 680px; }
  .rvbody h1 { font-size: 20px; margin: 0 0 4px; font-weight: 700; }
  .rvbody .sub { color: var(--faint); font-size: 12px; margin-bottom: 20px; }
  .rvsec { margin-bottom: 20px; }
  .rvsec h3 { font-size: 14px; margin: 0 0 6px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .rvsec p { margin: 0 0 8px; font-size: 13.5px; line-height: 1.65; color: var(--muted); }
  .compliance {
    margin: 8px 0 0; background: #EFF7ED; border: 1px solid #D0E8CB;
    border-radius: 9px; padding: 11px 13px; font-size: 12.5px;
  }
  .compliance .ph {
    display: flex; align-items: center; gap: 7px;
    font-weight: 700; color: var(--green); margin-bottom: 4px;
  }
  .compliance .ph .badge {
    font-size: 9.5px; padding: 2px 7px; border-radius: 20px;
    background: var(--green); color: #fff; font-weight: 700;
  }
  .reportchat {
    border-top: 1px solid var(--line); padding: 11px 22px;
    position: sticky; bottom: 0; background: var(--bg);
  }

  /* ── Utility ── */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 13px; border: 1px solid var(--line);
    border-radius: 8px; font-size: 12.5px;
    background: var(--panel); color: var(--muted);
    transition: border-color .12s, color .12s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent-text); }
  .btn.p {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .btn.p:hover { background: var(--accent-d); border-color: var(--accent-d); }
  .note {
    font-size: 11.5px; color: var(--faint); text-align: left;
    padding: 10px 0; border-top: 1px dashed var(--line); margin-top: 28px;
    line-height: 1.6;
  }
  .hidden { display: none !important; }

  select {
    font-family: inherit; font-size: 13px; padding: 8px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--ink);
    width: 100%; cursor: pointer;
  }
  select:focus { outline: 2px solid var(--accent); }
</style>

<script>

const companies = [

    transcript:[{t:'Q2 2026 Earnings Call Transcript',d:'Jul 11, 2026'}],

};
const tagName = {filing:'FILING', news:'NEWS', transcript:'TRANSCRIPT', web:'WEB'};
function coName(id){ return (companies.find(c=>c.id===id)||{}).name||''; }

/* ──────────────── State ──────────────── */
let ctx = {company:null, web:false};
let currentView='home', browseType='filing', browseGlobal=false;
let cmp = {companies:['medx','nano'], dims:['Revenue','Gross margin','Key risks']};
let report = {type:'Research report', sections:[
  {id:'overview',name:'Overview',on:true},
  {id:'metrics',name:'Financial highlights',on:true},
  {id:'devel',name:'Recent developments',on:true},
  {id:'risks',name:'Key risks',on:true},

  {id:'esg',name:'ESG disclosure',on:false},
  {id:'debt',name:'Debt & liquidity',on:false},
]};

/* ──────────────── Context chip ──────────────── */
function renderCtx(){
  const s = document.getElementById('ctxSlot');
  if(ctx.company){
    s.innerHTML=`<div class="ctxchip">◐ ${coName(ctx.company)} <span class="x" onclick="clearCtx()">✕</span></div>`;
  } else {
    s.innerHTML=`<div class="ctxchip empty">◌ No company selected</div>`;
  }
}
function clearCtx(){ ctx.company=null; renderCtx(); if(['home','answer'].includes(currentView)) go(currentView); }

/* ──────────────── Composer ──────────────── */
function sendIcon(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>`;
}
function composer(placeholder){
  const c = ctx.company;
  const coLabel = c
    ? `<button class="cpill on" onclick="clearCtx()">${coName(c)} ✕</button>`
    : `<button class="cpill" onclick="alert('Company is auto-detected from your question. Name one to lock it in.')"><span class="tog on"></span>Company auto-detect: On</button>`;
  return `
  <div class="composer">
    <textarea id="askbox" rows="1" placeholder="${placeholder}"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submitAsk()}"
      oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
    <div class="cbar">
      <button class="cpill" onclick="alert('Attach files or paste URLs to bring outside material into the thread.')">

        Attach

        <span class="tog ${ctx.web?'on':''}"></span>Web: ${ctx.web?'On':'Off'}
      </button>
      ${coLabel}
    </div>
    <button class="send-btn" onclick="submitAsk()" title="Send">${sendIcon()}</button>
  </div>
  <div class="srcnote">Grounded in ${c?coName(c)+"'s":'the'} filings, news &amp; transcripts${ctx.web?' <b>+ the web</b>':' — disclosed record only'}.</div>`;
}
function toggleWeb(){ ctx.web=!ctx.web; if(['home','answer'].includes(currentView)) go(currentView); }
function toggleSources(){
  const body=document.getElementById('srcBody');
  const chev=document.getElementById('srcChevron');
  if(!body||!chev) return;
  const collapsed=body.classList.toggle('collapsed');
  chev.classList.toggle('open', !collapsed);
}

/* Company inference */
function detectCompany(q){
  const s = q.toLowerCase();
  for(const c of companies){
    const first = c.name.toLowerCase().split(' ')[0].replace(/[^a-z]/g,'');
    if(s.includes(first)||s.includes(c.tick.split(':')[1].trim().toLowerCase())) return {status:'match',id:c.id};
  }
  if(/\b(they|their|them|it|its|this company|the company)\b/.test(s)&&!ctx.company) return {status:'ambiguous'};
  if(/\b(csa|regulation|market|sector|industry|guidance|peers)\b/.test(s)&&!ctx.company) return {status:'none'};
  return {status: ctx.company?'context':'none'};
}
let pendingQuery='';
function coChatSend(presetQ){
  const box = document.getElementById('askbox');
  const q = presetQ || (box?.value||'').trim();
  if(!q) return;
  const log = document.getElementById('coChat');
  if(!log) return;
  const prompts = document.getElementById('coPrompts');
  if(prompts) prompts.remove();
  log.innerHTML += `<div class="msg u"><span class="bubble">${escapeHtml(q)}</span></div>`;
  const c = ctx.company||'medx';
  const ans = q.toLowerCase().includes('earnings') || q.toLowerCase().includes('management')
    ? `On the Q2 2026 earnings call, the CFO reported revenue of $18.4M (up 12% QoQ) and guided to continued double-digit sequential growth into Q3, contingent on EU regulatory clearances. Gross margin expanded to 61%.`
    : `${coName(c)} reported Q2 2026 revenue of $18.4M, up 12% from $16.4M in Q1, driven by the new EU distribution agreement signed in June. The MD&A flags FX exposure on EUR receivables as a newly material risk. Gross margin improved to 61% on improved yield.`;
  log.innerHTML += `<div class="msg a"><span class="bubble">${ans}</span></div>`;
  if(box) box.value = '';
  log.scrollTop = log.scrollHeight;
}
function submitAsk(){
  if(currentView==='company'){ coChatSend(); return; }
  if(currentView==='doc'){ ppSend((document.getElementById('askbox')?.value||'').trim()); return; }
  const q = (document.getElementById('askbox').value||'').trim() || 'Summarize the latest MD&A and how Q2 revenue compares to Q1';
  pendingQuery = q;
  const det = detectCompany(q);
  if(det.status==='match')    { ctx.company=det.id; renderCtx(); showAnswer(q,'detected'); }
  else if(det.status==='context') { showAnswer(q,'context'); }
  else if(det.status==='ambiguous') { showDisambig(q); }
  else { ctx.company=null; renderCtx(); showAnswer(q,'general'); }
}

/* ──────────────── Router ──────────────── */
function setActiveNav(id){
  document.querySelectorAll('.sidebar .navbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById(id)?.classList.add('active');
}
function go(view){
  currentView = view;
  const m = document.getElementById('main');
  m.scrollTop = 0;
  renderCtx();
  if(view==='home')      { setActiveNav('nav-home');       m.innerHTML = viewHome(); }
  else if(view==='answer')    { setActiveNav('nav-home');       m.innerHTML = viewAnswer(lastAnswer.q, lastAnswer.how); }
  else if(view==='companies') { setActiveNav('nav-companies');  m.innerHTML = viewCompanies(); }
  else if(view==='company')   { setActiveNav('nav-companies');  m.innerHTML = viewCompanyOverview(); }
  else if(view==='compare')   { setActiveNav('nav-compare');    m.innerHTML = viewCompare(); }
  else if(view==='browse')    {
    setActiveNav('nav-'+(browseType==='filing'?'filings':browseType==='news'?'news':'transcripts'));
    m.innerHTML = viewBrowse();
  }
  else if(view==='doc')    { m.innerHTML = viewDoc(); }
  else if(view==='report') { m.innerHTML = viewReport(); }
  else if(view==='library'){ setActiveNav('nav-library'); m.innerHTML = viewLibrary(); }
}

/* ──────────────── Disambiguation ──────────────── */
function showDisambig(q){
  setActiveNav('nav-home'); currentView='home';
  document.getElementById('main').innerHTML=`<div class="wrap">
    <h2 class="qhead">${escapeHtml(q)}</h2>
    <div class="disamb">
      <div class="q">🔎 That question refers to a company, but I'm not sure <b>which one</b>. Which did you mean?</div>
      <div class="opts">
        ${companies.slice(0,4).map(c=>`<button class="opt" onclick="pickDisambig('${c.id}')">${c.name} <span style="color:var(--faint)">· ${c.tick}</span></button>`).join('')}
      </div>
    </div>
    <div style="margin-top:20px">${composer('Refine your question…')}</div>
    <div class="note">Ambiguity path: the system detected a company reference ("their/they/this company") with no active company set, so it asks rather than guessing.</div>
  </div>`;
}
function pickDisambig(id){ ctx.company=id; renderCtx(); showAnswer(pendingQuery,'detected'); }

/* ──────────────── Answer ──────────────── */
function openSrc(tag,co,title){ if(tag==='web'){alert('Opens the web source in a new tab.');} else {openDoc(co,tag,title,'Jul 2026');} }
let lastAnswer={q:'',how:''};
function showAnswer(q,how){ lastAnswer={q,how}; currentView='answer'; setActiveNav('nav-home'); document.getElementById('main').innerHTML=viewAnswer(q,how); document.getElementById('main').scrollTop=0; }
function viewAnswer(q,how){
  const web=ctx.web; const c=ctx.company;
  const detLine = how==='detected'
    ? `✓ Detected company from your question — <b>${coName(c)}</b> is now the active context.`
    : how==='context'
    ? `◐ Answered in the context of <b>${coName(c)}</b>.`
    : how==='general'
    ? `◌ No specific company — answered from ${web?'the web':'regulatory / market'} sources.`
    : `◐ <b>${coName(c)}</b>`;
  let srcCards, answerBody;
  if(how==='general'){
    srcCards=[
      {tag:'web',t:'CSA Staff Notice 51-XXX',m:'securities-administrators.ca'},
      {tag:'web',t:'Continuous disclosure update — Jul 2026',m:'regulatory-brief.com'},
      {tag:'web',t:'CSA news release',m:'osc.ca'},
    ];
    answerBody=`<p>This month the CSA published updated staff guidance on continuous disclosure obligations, focused on climate-related risk reporting and non-GAAP measures<a class="cite">1</a><a class="cite">2</a>. Key changes include tighter expectations around forward-looking-information cautionary language<a class="cite">3</a>.</p>
      <p style="color:var(--faint);font-size:13px">No company context was needed for this question. Name a company any time to scope future answers to its record.</p>`;
  } else {
    srcCards=[
      {tag:'filing',    t:'MD&A — Q2 2026',          m:coName(c)+' · p.14'},
      {tag:'transcript',t:'Q2 2026 Earnings Call',   m:coName(c)+' · CFO'},
      {tag:'news',      t:'Q2 2026 Financial Results',m:coName(c)+' · release'},
      web
        ? {tag:'web',t:'Med-tech sector outlook 2026',m:'industry-analyst.com'}
        : {tag:'filing',t:'Interim Financials Q2 2026',m:coName(c)+' · Note 4'},
    ];
    answerBody=`<p>${coName(c)} reported <b>Q2 2026 revenue of $18.4M</b>, up <b>12%</b> from <b>$16.4M in Q1</b><a class="cite">1</a><a class="cite">3</a>, driven mainly by the new EU distribution agreement signed in June<a class="cite">2</a>.</p>
      <h3>What the MD&amp;A emphasizes</h3>
      <p>Gross margin expanded to <b>61%</b> (from 58%) on improved yield; management flags FX exposure on EUR receivables as newly material<a class="cite">1</a>.</p>
      <h3>On the earnings call</h3>
      <p>The CFO guided to continued double-digit sequential growth into Q3, contingent on EU regulatory clearances<a class="cite">2</a>.</p>
      ${web?`<h3>Market context <span style="font-size:11px;color:var(--faint)">(web)</span></h3><p>Analysts expect mid-teens revenue growth across comparable med-tech names in 2026, putting ${coName(c)} slightly ahead of peer pace<a class="cite">4</a>.</p>`:''}`;
  }
  const ctxPill = c
    ? `<span class="answer-ctx-pill">${coName(c)} <span class="xbtn" onclick="clearCtx()">×</span></span>`
    : '';
  return `<div class="answer-topbar"><div class="answer-topbar-inner">Ask about ${ctxPill}</div></div>
  <div class="wrap">
    <h2 class="qhead">${escapeHtml(q)}</h2>
    <div class="detect">${detLine}</div>
    <div class="answer">${answerBody}</div>
    <hr class="content-divider">
    <div class="srchead" onclick="toggleSources()" id="srchead">
      <span class="src-chevron open" id="srcChevron">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </span>
      Sources · ${srcCards.length} · ${web?'disclosed record + web':(how==='general'?'web':'disclosed record only')}
    </div>
    <div class="src-body" id="srcBody">
      <div class="sources">
        ${srcCards.map(s=>`<div class="src" onclick="openSrc('${s.tag}','${c}','${esc(s.t)}')">
          <span class="tg ${s.tag}">${tagName[s.tag]}</span>
          <div class="st">${s.t}</div>
          <div class="sm">${s.m}</div>
        </div>`).join('')}
      </div>
      <div class="progress">
        ${how!=='general'?`<div class="pstep"><span class="pk">✓</span> Searching ${coName(c)}'s filings, news &amp; transcripts</div>`:''}
        ${web||how==='general'?'<div class="pstep"><span class="pk">✓</span> Searching the web</div>':''}
        <div class="pstep"><span class="pk">✓</span> Verifying figures against sources</div>
      </div>
    </div>
    <div class="followups"><h4>Follow-up</h4>
      <div class="fu" onclick="quick('How did the FX risk language change vs the FY2025 AIF?')"><span>How has the FX risk language changed vs. the AIF?</span><span class="pl">＋</span></div>
      <div class="fu" onclick="go('compare')"><span>Compare this to peers</span><span class="pl">＋</span></div>
      <div class="fu" onclick="go('report')"><span>Turn this into a research report</span><span class="pl">＋</span></div>
    </div>
    <div class="aacts">
      <button class="btn" onclick="alert('Share link created.')">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><polyline points="15 17 20 12 15 7"/><path d="M4 18v-2a4 4 0 0 1 4-4h12"/></svg>
        Share
      </button>
      <button class="btn" onclick="alert('Branded PDF downloaded.')">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M12 18v-6"/><path d="m9 15 3 3 3-3"/></svg>
        Download Report
      </button>
    </div>
    <div class="sticky-composer">${composer('Ask a follow-up…')}</div>
  </div>`;
}

/* ──────────────── Browse ──────────────── */
function openBrowse(type){ browseType=type; go('browse'); }
function viewBrowse(){
  const label = browseType==='filing'?'Filings':browseType==='news'?'News':'Earnings Call Transcripts';
  const c = ctx.company;
  let rows=[];
  if(browseGlobal||!c){ Object.keys(docs).forEach(cid=>{ (docs[cid][browseType]||[]).forEach(d=>rows.push({...d,co:cid})); }); }
  else { (docs[c]?.[browseType]||[]).forEach(d=>rows.push({...d,co:c})); }
  rows.sort((a,b)=>new Date(b.d)-new Date(a.d));
  return `<div class="wrap">
    <div class="pagehd">
      <h1>${label}</h1>
      <div class="scopetoggle">
        <button class="${(!browseGlobal&&c)?'on':''}" onclick="setBrowseScope(false)" ${!c?'disabled style="opacity:.4"':''}>${c?coName(c):'(no company)'}</button>
        <button class="${(browseGlobal||!c)?'on':''}" onclick="setBrowseScope(true)">All companies</button>
      </div>
    </div>
    <input class="browsesearch" id="bsearch" placeholder="Search ${label.toLowerCase()} by name…" oninput="renderBrowseRows()">
    <div id="browserows">${rows.map(browseRow).join('')}</div>
    <div class="note">Search · retrieve · view. ${c?'Defaults to '+coName(c)+'; toggle to search every company.':'No active company — showing all. Set a company to scope it.'} Click any document to chat with it.</div>
  </div>`;
}
function setBrowseScope(g){ browseGlobal=g; go('browse'); }
function browseRow(d){
  return `<div class="doc" onclick="openDoc('${d.co}','${browseType}','${esc(d.t)}','${d.d}')">
    <span class="tg ${browseType}">${tagName[browseType]}</span>
    <div style="flex:1"><div class="dt">${d.t}</div><div class="co">${coName(d.co)}</div></div>
    <span class="dd">${d.d}</span>
  </div>`;
}
function renderBrowseRows(){
  const q=(document.getElementById('bsearch').value||'').toLowerCase();
  const c=ctx.company; let rows=[];
  if(browseGlobal||!c){ Object.keys(docs).forEach(cid=>{ (docs[cid][browseType]||[]).forEach(d=>rows.push({...d,co:cid})); }); }
  else { (docs[c]?.[browseType]||[]).forEach(d=>rows.push({...d,co:c})); }
  rows = rows.filter(d=>d.t.toLowerCase().includes(q)).sort((a,b)=>new Date(b.d)-new Date(a.d));
  document.getElementById('browserows').innerHTML = rows.map(browseRow).join('')||'<div style="padding:14px;color:var(--faint)">No matches.</div>';
}

let curDoc={};
function openDoc(co,type,t,d){ curDoc={co,type,t,d,started:false}; ctx.company=co; renderCtx(); currentView='doc'; document.getElementById('main').innerHTML=viewDoc(); }
function viewDoc(){
  const isT = curDoc.type==='transcript';
  const p1 = isT?'Summarize the call':'Summarize this document';
  const p2 = isT?'What did analysts ask?':'Highlight key points';
  const typeLabel = curDoc.type==='filing'?'Filings':curDoc.type==='news'?'News':'Earnings Transcripts';
  const body = isT
    ?`<h2>${curDoc.t}</h2><div class="sub">${coName(curDoc.co)} · ${curDoc.d} · Earnings Call Transcript</div>
      <p><b>Operator:</b> Good morning, and welcome to the ${coName(curDoc.co)} Q2 2026 earnings call…</p>
      <p><b>CEO:</b> Q2 was strong — revenue of $18.4M, up 12% sequentially, driven by our new EU distribution agreement…</p>
      <p><b>CFO:</b> Gross margin expanded to 61%. We expect double-digit sequential growth into Q3, contingent on EU clearances…</p>
      <p><b>Analyst (Q):</b> Can you quantify the EU agreement's contribution this quarter?</p>`
    :`<h2>${curDoc.t}</h2><div class="sub">${coName(curDoc.co)} · ${curDoc.d} · via EDGAR</div>
      <p>This Management's Discussion and Analysis should be read with the condensed interim financial statements for the three months ended June 30, 2026…</p>
      <p><b>Results of Operations.</b> Revenue was $18.4M, up 12% from $16.4M in the prior quarter, primarily attributable to the new European distribution agreement…</p>
      <p><b>Liquidity.</b> The Company maintains FX exposure on EUR-denominated receivables, now considered a material risk…</p>`;
  return `<div class="answer-topbar"><div class="answer-topbar-inner flush">
    <span class="back-link" onclick="openBrowse('${curDoc.type}')">‹ ${typeLabel}</span>
    <span style="color:var(--line)">·</span>
    <span class="back-link" onclick="go('company')">${coName(curDoc.co)}</span>
    <span style="color:var(--line)">·</span>
    <span style="color:var(--ink);font-size:13px">${trunc(curDoc.t,40)}</span>
  </div></div>
  <div class="co-page-layout">
    <div class="co-left" style="padding:40px 40px 40px 32px;">
      ${body}
    </div>
    <div class="co-right">
      <div class="chatlog" id="chatlog">
        <div id="pp" class="co-prompts">
          <button class="co-prompt" onclick="ppSend('${p2}')">${p2}</button>
          <button class="co-prompt" onclick="ppSend('${p1}')">${p1}</button>
        </div>
      </div>
      <div class="sticky-composer">${composer('Ask about this '+(isT?'transcript':curDoc.type)+'…')}</div>
    </div>
  </div>`;
}
function ppSend(text){
  if(!text) return;
  const log = document.getElementById('chatlog');
  if(!curDoc.started){ log.innerHTML=''; curDoc.started=true; }
  log.innerHTML+=`<div class="msg u"><span class="bubble">${escapeHtml(text)}</span></div>`;
  const ans = curDoc.type==='transcript'
    ? 'On the call, management reported Q2 revenue of $18.4M (up 12% QoQ) and guided to continued double-digit growth into Q3, contingent on EU clearances. Gross margin expanded to 61%.'
    : 'Key points: revenue $18.4M (+12% QoQ) on the new EU distribution agreement; gross margin 61%; FX exposure on EUR receivables now flagged as material. Every figure traces to the passages at left.';
  log.innerHTML+=`<div class="msg a"><span class="bubble">${ans}</span></div>`;
  const box = document.getElementById('askbox'); if(box) box.value='';
  log.scrollTop = log.scrollHeight;
}
